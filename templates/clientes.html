{% extends "base.html" %}
{% block conteudo %}
<div class="topo">
  <h1>Clientes</h1>
  <a class="btn" href="{{ url_for('cliente_novo') }}">+ Novo cliente</a>
</div>
<form class="busca" method="get">
  <input name="q" placeholder="Buscar cliente pelo nome" value="{{ request.args.get('q','') }}">
</form>
<table class="tabela">
  <tr><th>Nome</th><th>Telefone</th><th>E-mail</th><th>Aniversário</th><th>Observações</th><th>Ações</th></tr>
  {% for c in clientes %}
  <tr>
    <td>{{ c.nome }}</td><td>{{ c.telefone }}</td><td>{{ c.email }}</td><td>{{ c.aniversario }}</td><td>{{ c.observacoes }}</td>
    <td class="acoes">
      <a class="btn-mini" href="{{ url_for('cliente_editar', id=c.id) }}">Editar</a>
      <form method="post" action="{{ url_for('cliente_excluir', id=c.id) }}" onsubmit="return confirm('Excluir {{ c.nome }}? Essa ação não pode ser desfeita.')">
        <button class="btn-mini perigo">Excluir</button>
      </form>
    </td>
  </tr>
  {% else %}<tr><td colspan="6">Nenhum cliente cadastrado.</td></tr>{% endfor %}
</table>
{% endblock %}
